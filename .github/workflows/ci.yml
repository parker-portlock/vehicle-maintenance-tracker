name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: maintenance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # +psycopg2 dialect is required: the app ships psycopg2-binary, and
      # SQLAlchemy 2.x resolves a plain postgresql:// URL to the psycopg
      # (v3) driver, which is not installed
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/maintenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Match the Docker runtime image (python:3.12-alpine) and the
          # Python version the requirements locks were resolved with
          python-version: "3.12"
      - name: Install backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx
      - name: Validate migrations
        run: |
          cd backend
          alembic upgrade head
      - name: Run tests
        run: |
          cd backend
          pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: cd frontend && npm ci
      - name: Type-check and build
        run: cd frontend && npm run build