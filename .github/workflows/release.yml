name: Release

on:
  pull_request_target:
    types: [closed]

jobs:
  release:
    runs-on: ubuntu-latest
    # Only run when a PR was actually merged into main (closed includes unmerged PRs)
    if: github.event.pull_request.merged && github.event.pull_request.base.ref == 'main'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VERSION=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          TAG="v${{ steps.version.outputs.VERSION }}"
          # Replace a pre-existing tag (e.g. from an earlier release of the same
          # version) so the push is never rejected
          if git ls-remote --tags origin "$TAG" | grep -q "refs/tags/$TAG"; then
            git push origin ":refs/tags/$TAG"
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Delete existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.version.outputs.VERSION }}" --yes 2>/dev/null || true

      - name: Extract changelog section
        run: |
          awk '/^## \['"v?${{ steps.version.outputs.VERSION }}"'\]/ {flag=1; next} /^## \[/ && flag {exit} flag' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          # Single app image (nginx + FastAPI + built frontend) built
          # from the repo-root Dockerfile
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.VERSION }}